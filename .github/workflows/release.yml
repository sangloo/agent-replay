name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@11.6.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check whether this version needs publishing
        id: release
        run: node packages/app/scripts/release-status.mjs
      - if: steps.release.outputs.publish == 'true'
        run: pnpm package
      - if: steps.release.outputs.publish == 'true'
        run: node packages/app/.package/bin/replay.mjs help
      - name: Publish through npm trusted publishing
        if: steps.release.outputs.publish == 'true'
        working-directory: packages/app/.package
        run: npm publish --access public --provenance --ignore-scripts
